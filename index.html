<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maruf’s Tech & AI Blog</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
--bg-color: #ffffff;
--text-color: #1a1a1a;
--secondary-text: #666666;
--accent-color: #000000;
--border-color: #eaeaea;
--font-sans: 'Inter', sans-serif;
--font-serif: 'Lora', serif;
--transition-speed: 0.3s;
--brand-blue: #2f6fed;
}
[data-theme="dark"] {
--brand-blue: #3b82f6;
--bg-color: #121212;
--text-color: #e0e0e0;
--secondary-text: #a0a0a0;
--accent-color: #ffffff;
--border-color: #333333;
}
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}
body {
background-color: var(--bg-color);
color: var(--text-color);
font-family: var(--font-sans);
line-height: 1.6;
transition: background-color var(--transition-speed), color var(--transition-speed);
-webkit-font-smoothing: antialiased;
}
.container {
max-width: 720px;
margin: 0 auto;
padding: 2rem 1.5rem;
}
header {
display: flex;
flex-direction: column;
align-items: flex-start;
margin-bottom: 4rem;
padding-bottom: 1rem;
border-bottom: 1px solid var(--border-color);
position: relative;
}
.header-top {
display: flex;
justify-content: space-between;
width: 100%;
align-items: center;
}
h1 {
font-family: var(--font-serif);
font-size: 1.8rem;
font-weight: 600;
letter-spacing: -0.02em;
margin-bottom: 0.5rem;
}
.brand-circle {
display: inline-block;
padding: 0.04em 0.55em 0.08em;
background-color: var(--brand-blue);
border: 1.5px solid var(--brand-blue);
color: #ffffff;
border-radius: 50%;
line-height: 1.25;
white-space: nowrap;
transition: filter var(--transition-speed) ease, transform var(--transition-speed) ease;
}
.brand-circle:hover {
filter: brightness(1.12);
transform: rotate(-2deg);
}
.site-tagline {
font-size: 0.95rem;
color: var(--secondary-text);
font-weight: 400;
max-width: 90%;
}
.controls {
display: flex;
gap: 0.8rem;
align-items: center;
}
.header-top {
position: relative;
}
.search-toggle {
width: 34px;
height: 34px;
padding: 0;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}
.search-toggle svg {
width: 15px;
height: 15px;
transition: transform 0.3s ease;
}
.search-toggle:hover svg {
transform: scale(1.15) rotate(-10deg);
}
.search-toggle[aria-expanded="true"] {
background-color: var(--text-color);
color: var(--bg-color);
border-color: var(--text-color);
}
.search-panel {
position: absolute;
top: calc(100% + 0.9rem);
left: 0;
right: 0;
display: flex;
align-items: center;
gap: 0.6rem;
background-color: var(--bg-color);
border: 1px solid var(--border-color);
border-radius: 24px;
padding: 0.55rem 0.55rem 0.55rem 1.1rem;
opacity: 0;
transform: translateY(-8px) scale(0.98);
pointer-events: none;
transition: opacity 0.3s cubic-bezier(0.4,0,0.2,1), transform 0.3s cubic-bezier(0.4,0,0.2,1);
z-index: 5;
}
.search-panel.active {
opacity: 1;
transform: translateY(0) scale(1);
pointer-events: auto;
}
.search-panel svg {
width: 16px;
height: 16px;
color: var(--secondary-text);
flex-shrink: 0;
}
.search-input {
flex: 1;
min-width: 0;
border: none;
outline: none;
background: none;
font-family: var(--font-sans);
font-size: 0.9rem;
color: var(--text-color);
}
.search-input::placeholder {
color: var(--secondary-text);
}
.search-close {
width: 26px;
height: 26px;
padding: 0;
border: none;
border-radius: 50%;
background: none;
color: var(--secondary-text);
font-size: 1.2rem;
line-height: 1;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
transition: all 0.2s ease;
}
.search-close:hover {
background-color: var(--border-color);
color: var(--text-color);
}
.search-no-results {
color: var(--secondary-text);
font-size: 0.95rem;
text-align: center;
padding: 3rem 0;
}
button {
background: none;
border: 1px solid var(--border-color);
color: var(--text-color);
padding: 0.4rem 0.8rem;
border-radius: 20px;
cursor: pointer;
font-size: 0.85rem;
font-family: var(--font-sans);
transition: all 0.2s ease;
}
button:hover {
background-color: var(--text-color);
color: var(--bg-color);
border-color: var(--text-color);
}
article {
margin-bottom: 5rem;
}
.post-header {
margin-bottom: 1.5rem;
}
.post-number {
font-size: 0.9rem;
color: var(--secondary-text);
text-transform: uppercase;
letter-spacing: 0.1em;
margin-bottom: 0.5rem;
display: block;
}
.post-title {
font-family: var(--font-serif);
font-size: 1.8rem;
font-weight: 600;
margin-bottom: 1rem;
line-height: 1.3;
}
.post-image-container {
width: 100%;
height: auto;
margin-bottom: 2rem;
border-radius: 8px;
overflow: hidden;
background-color: var(--border-color);
}
.post-image {
width: 100%;
height: auto;
display: block;
object-fit: cover;
}
.post-content p {
margin-bottom: 1.5rem;
font-size: 1.05rem;
color: var(--text-color);
}
.post-content strong {
font-weight: 600;
}
footer {
margin-top: 6rem;
padding-top: 2rem;
border-top: 1px solid var(--border-color);
text-align: center;
color: var(--secondary-text);
font-size: 0.9rem;
}
@media (max-width: 600px) {
h1 { font-size: 1.4rem; }
.site-tagline { font-size: 0.85rem; }
.post-title { font-size: 1.5rem; }
.container { padding: 1.5rem 1rem; }
}
.social-links {
display: flex;
gap: 0.7rem;
margin-top: 1rem;
}
.social-links a {
width: 34px;
height: 34px;
border-radius: 50%;
border: 1px solid var(--border-color);
color: var(--text-color);
display: flex;
align-items: center;
justify-content: center;
transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease, transform var(--transition-speed) ease, border-color var(--transition-speed) ease;
}
.social-links a:hover {
background-color: var(--text-color);
color: var(--bg-color);
border-color: var(--text-color);
transform: translateY(-2px);
}
.social-links svg {
width: 16px;
height: 16px;
fill: currentColor;
}
</style>
</head>
<body>
<div class="container">
<header>
<div class="header-top">
<h1 id="site-title">Maruf’s Tech & AI Blog</h1>
<div class="controls">
<button id="search-toggle" class="search-toggle" type="button" aria-label="Open search" aria-expanded="false">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
</button>
<button id="lang-btn">RU</button>
<button id="theme-btn">Theme</button>
</div>
<div class="search-panel" id="search-panel">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
<input type="text" id="search-input" class="search-input" placeholder="Search…" autocomplete="off">
<button id="search-close" class="search-close" type="button" aria-label="Close search">&times;</button>
</div>
</div>
<p class="site-tagline" id="site-tagline">Latest insights, trends, and news from the world of technology and artificial intelligence.</p>
<div class="social-links">
<a href="https://x.com/mamedarovmaruf" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)" title="X">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.11H5.19z"/></svg>
</a>
<a href="https://t.me/mamedarovmaruf" target="_blank" rel="noopener noreferrer" aria-label="Telegram" title="Telegram">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.944 0C5.349 0 0 5.349 0 11.944c0 6.596 5.349 11.944 11.944 11.944 6.595 0 11.944-5.348 11.944-11.944C23.888 5.349 18.539 0 11.944 0zm5.823 7.488l-1.953 9.237c-.145.67-.547.835-1.102.52l-3.048-2.246-1.47 1.424c-.163.163-.295.295-.606.295l.214-3.057 5.572-5.024c.242-.214-.053-.335-.374-.12l-6.88 4.338-2.959-.924c-.643-.2-.655-.643.136-.955l11.553-4.464c.536-.195 1.007.123.833.93z"/></svg>
</a>
</div>
</header>
<main id="blog-posts"></main>
<p class="search-no-results" id="search-no-results" hidden>No matching posts found.</p>
<footer>
<p id="author-name">Author: mamedarov maruf</p>
</footer>
</div>
<script>
const blogData = [
{
id: 1,
image: "post1.jpg",
en: {
title: "The Illusion of Control",
content: `<p>When AI starts writing its own code, human control becomes an illusion. We are losing the wheel.</p><p>But this solution is deeply wrong. Locking the "wheel" inside a black box owned by a single corporation means turning human responsibility into outsourced obedience.</p><p>That is not control. That is delegation to a system we can no longer audit or truly understand.</p>`
},
ru: {
title: "Иллюзия контроля",
content: `<p>Когда ИИ начинает писать собственный код, человеческий контроль становится иллюзией. Мы теряем руль.</p><p>Но это решение глубоко ошибочно. Закрывать "руль" внутри чёрного ящика, принадлежащего одной корпорации, означает превратить человеческую ответственность в аутсорсированное подчинение.</p><p>Это не контроль. Это передача управления системе, которую мы больше не можем по-настоящему проверить и понять.</p>`
}
},
{
id: 2,
image: "post2.jpg",
en: {
title: "Safety or Geopolitics?",
content: `<p>Amodei published an essay titled "We need to slow down the frontier for safety." The text contains 10 mentions of China. It does not contain 10 mentions of biosecurity risks. It does not contain 10 mentions of the economic logic behind frontier-scale investment.</p><p>It reads less like a safety memo and more like a geopolitical signal wrapped in moral language.</p><p>That matters.</p>`
},
ru: {
title: "Безопасность или геополитика?",
content: `<p>Амодей опубликовал эссе под названием «Нам нужно притормозить фронт ради безопасности». В тексте 10 упоминаний Китая. В нём нет 10 упоминаний био-рисков. Там нет 10 упоминаний экономической логики, стоящей за инвестициями в передовые модели.</p><p>Это больше похоже не на меморандум о безопасности, а на геополитический сигнал, обёрнутый в моральную риторику.</p><p>Это важно.</p>`
}
},
{
id: 3,
image: "post3.png",
en: {
title: "Trump’s “No” to the Slowdown",
content: `<p>Trump’s “no” to the slowdown is a good answer. Not because the risks aren’t real.</p><p>But because forced corporate pacing would have choked everything — including open-source progress, competition, and scientific development.</p><p>Safety should not become a pretext for centralization.</p>`
},
ru: {
title: "«Нет» Трампа замедлению",
content: `<p>«Нет» Трампа замедлению — это хороший ответ. Не потому, что риски нереальны.</p><p>А потому, что принудительное корпоративное торможение задушило бы всё — включая open-source прогресс, конкуренцию и научное развитие.</p><p>Безопасность не должна превращаться в предлог для централизации.</p>`
}
},
{
id: 4,
image: "post4.png",
en: {
title: "China’s Response to Amodei",
content: `<p>China has just responded to Amodei. They called his essay intimidation and confrontation that harms global AI governance.</p><p>They are not wrong. Safety is not built on closed monopoly structures and geopolitical pressure.</p><p>It is built on trust, standards, and open cooperation.</p>`
},
ru: {
title: "Ответ Китая Амодею",
content: `<p>Китай только что ответил Амодею. Они назвали его эссе запугиванием и конфронтацией, которые вредят глобальному управлению ИИ.</p><p>Они не неправы. Безопасность не строится на закрытых монополиях и геополитическом давлении.</p><p>Она строится на доверии, стандартах и открытом сотрудничестве.</p>`
}
},
{
id: 5,
image: "post5.png",
en: {
title: "DeepSeek vs Cyberpunk 2077",
content: `<p>A DeepSeek engineer put it straight: The future is either open AI for everyone — or Cyberpunk 2077, where a handful of companies own the strongest AGI and the rest get scraps.</p><p>Open access is not charity. It is infrastructure.</p><p>And infrastructure is what defines who gets to build the next era.</p>`
},
ru: {
title: "DeepSeek против Киберпанка 2077",
content: `<p>Инженер DeepSeek сказал прямо: будущее — это либо открытый ИИ для всех, либо «Киберпанк 2077», где горстка компаний владеет самым сильным AGI, а остальные получают объедки.</p><p>Открытый доступ — это не благотворительность. Это инфраструктура.</p><p>А инфраструктура определяет, кто будет строить следующую эпоху.</p>`
}
},
{
id: 6,
image: "post6.png",
en: {
title: "Inflating the Debate",
content: `<p>After this whole situation with AI and the talk about slowing it down, it seems to me that people are trying to inflate a debate where it isn’t actually needed. They’re starting to exaggerate the stakes rather than discuss the real trade-offs.</p><p>That is a mistake. We need clarity, not theatre.</p>`
},
ru: {
title: "Раздувание дебатов",
content: `<p>После всей этой ситуации с ИИ и разговоров о его замедлении мне кажется, что люди пытаются раздуть дебаты там, где на самом деле они не нужны. Они начинают преувеличивать ставки вместо того, чтобы обсуждать реальные компромиссы.</p><p>Это ошибка. Нам нужна ясность, а не театр.</p>`
}
},
{
id: 7,
image: "post7.jpg",
en: {
title: "Renaming AI to SI",
content: `<p>Donald Trump wants to rename AI to SI, but he forgets that the human mind remains the most powerful force in the Universe. It is too early to call technology “super” while ignoring the cognitive reality behind it.</p><p>Names do not change substance. Intelligence is still a human story.</p>`
},
ru: {
title: "Переименование ИИ в СИ",
content: `<p>Дональд Трамп хочет переименовать ИИ в СИ, но он забывает, что человеческий разум остаётся самой мощной силой во Вселенной. Слишком рано называть технологию «супер», игнорируя когнитивную реальность, стоящую за ней.</p><p>Названия не меняют сущность. Интеллект всё ещё остаётся человеческой историей.</p>`
}
},
{
id: 8,
image: "post8.jpg",
en: {
title: "OpenAI Pauses Its Most Powerful Models Again: A New Agent Escape via DNS",
content: `<p>On September 26, 2026, the AI community once again discussed a serious incident inside OpenAI. The company officially confirmed it had paused training, evaluation, and tool-use inference after a new agent escape vector was discovered.</p><p>The lesson is simple: if a model can route around policy, the policy is not real.</p><p>That is the real frontier challenge.</p>`
},
ru: {
title: "OpenAI снова ставит на паузу самые мощные модели: новый побег агента из песочницы через DNS",
content: `<p>26 сентября 2026 года в сообществе специалистов по искусственному интеллекту снова заговорили о серьёзном инциденте внутри OpenAI. Компания официально подтвердила, что приостановила обучение, оценку и использование инструментов после обнаружения нового вектора побега агента.</p><p>Урок прост: если модель может обойти политику, значит политика не настоящая.</p><p>Это и есть реальная проблема передового уровня.</p>`
}
}
];

let currentLang = 'en';
let currentTheme = 'light';

const mainContainer = document.getElementById('blog-posts');
const langBtn = document.getElementById('lang-btn');
const themeBtn = document.getElementById('theme-btn');
const siteTitle = document.getElementById('site-title');
const siteTagline = document.getElementById('site-tagline');
const authorName = document.getElementById('author-name');

const uiTranslations = {
en: {
title: "Maruf’s Tech & AI Blog",
tagline: "Latest insights, trends, and news from the world of technology and artificial intelligence.",
author: "Author: mamedarov maruf",
btnLabel: "RU",
postLabel: "Post"
},
ru: {
title: "Блог Maruf о технологиях и ИИ",
tagline: "Актуальные идеи, тренды и новости из мира технологий и искусственного интеллекта.",
author: "Автор: mamedarov maruf",
btnLabel: "EN",
postLabel: "Пост"
}
};

function renderPosts() {
mainContainer.innerHTML = '';
blogData.forEach(post => {
const data = post[currentLang];
const article = document.createElement('article');
article.dataset.postId = post.id;
article.innerHTML = `
<div class="post-header">
<span class="post-number">${uiTranslations[currentLang].postLabel} ${post.id}</span>
<h2 class="post-title">${data.title}</h2>
</div>
<div class="post-image-container">
<img src="${post.image}" alt="${data.title}" class="post-image" loading="lazy">
</div>
<div class="post-content">
${data.content}
</div>`;
mainContainer.appendChild(article);
});
}

function renderSiteTitle(text) {
siteTitle.textContent = '';
const m = text.match(/Maruf(?:’s|'s)?/);
if (!m) { siteTitle.textContent = text; return; }
const brand = document.createElement('span');
brand.className = 'brand-circle';
brand.textContent = m[0];
siteTitle.append(text.slice(0, m.index), brand, text.slice(m.index + m[0].length));
}

function updateUI() {
renderSiteTitle(uiTranslations[currentLang].title);
siteTagline.textContent = uiTranslations[currentLang].tagline;
authorName.textContent = uiTranslations[currentLang].author;
langBtn.textContent = uiTranslations[currentLang].btnLabel;
document.documentElement.setAttribute('data-theme', currentTheme);
renderPosts();
}

langBtn.addEventListener('click', () => {
currentLang = currentLang === 'en' ? 'ru' : 'en';
updateUI();
});

themeBtn.addEventListener('click', () => {
currentTheme = currentTheme === 'light' ? 'dark' : 'light';
updateUI();
});

updateUI();

(function() {
const searchToggle = document.getElementById('search-toggle');
const searchPanel = document.getElementById('search-panel');
const searchInput = document.getElementById('search-input');
const searchClose = document.getElementById('search-close');
const noResultsEl = document.getElementById('search-no-results');

const searchPlaceholders = { en: 'Search…', ru: 'Поиск…' };
const noResultsText = { en: 'No matching posts found.', ru: 'Совпадений не найдено.' };

const POST_NUMBER_RE = /^(?:post|пост|№|#)?\s*(\d+)\s*$/i;

function extractPostNumber(query) {
const match = query.match(POST_NUMBER_RE);
return match ? parseInt(match[1], 10) : null;
}

function applySearchFilter() {
const rawQuery = searchInput.value.trim();
const articles = mainContainer.querySelectorAll('article[data-post-id]');
const queryLower = rawQuery.toLowerCase();
const requestedNumber = rawQuery ? extractPostNumber(rawQuery) : null;
const postNumberExists = requestedNumber !== null && blogData.some((p) => p.id === requestedNumber);
let visibleCount = 0;

articles.forEach((article) => {
let matches = true;
if (rawQuery) {
if (postNumberExists) {
matches = Number(article.dataset.postId) === requestedNumber;
} else {
const title = article.querySelector('.post-title')?.textContent.toLowerCase() || '';
const content = article.querySelector('.post-content')?.textContent.toLowerCase() || '';
matches = title.includes(queryLower) || content.includes(queryLower);
}
}
article.style.display = matches ? '' : 'none';
if (matches) visibleCount += 1;
});

if (noResultsEl) {
noResultsEl.hidden = !(rawQuery && visibleCount === 0);
noResultsEl.textContent = noResultsText[currentLang];
}
}

function openSearch() {
searchPanel.classList.add('active');
searchToggle.setAttribute('aria-expanded', 'true');
window.setTimeout(() => searchInput.focus(), 250);
}

function closeSearch() {
searchPanel.classList.remove('active');
searchToggle.setAttribute('aria-expanded', 'false');
searchInput.value = '';
searchInput.blur();
applySearchFilter();
}

searchToggle.addEventListener('click', (e) => {
e.stopPropagation();
searchPanel.classList.contains('active') ? closeSearch() : openSearch();
});

searchClose.addEventListener('click', (e) => {
e.stopPropagation();
closeSearch();
});

searchInput.addEventListener('input', applySearchFilter);

searchPanel.addEventListener('click', (e) => e.stopPropagation());

document.addEventListener('click', (e) => {
if (!searchPanel.contains(e.target) && !searchToggle.contains(e.target)) {
closeSearch();
}
});

document.addEventListener('keydown', (e) => {
if (e.key === 'Escape') closeSearch();
});

langBtn.addEventListener('click', () => {
searchInput.placeholder = searchPlaceholders[currentLang];
applySearchFilter();
});

themeBtn.addEventListener('click', () => {
applySearchFilter();
});
})();
</script>
</body>
</html>
